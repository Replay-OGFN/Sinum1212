name: Build Sinum

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug files
        run: |
          ls -R

      - name: Find build script
        run: |
          find . -name "build-mac.sh" || true

      - name: Run build if exists
        run: |
          chmod +x $(find . -name "build-mac.sh" | head -n 1)
          cd $(dirname $(find . -name "build-mac.sh" | head -n 1))
          ./build-mac.sh
